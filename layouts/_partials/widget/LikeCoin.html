{{- $context := .Context -}}
{{- $LikerID := .Site.Params.likerID -}}

<section class="widget likecoin">
    <div class="widget-icon">
    </div>
    <h2 class="widget-title section-title">LikeCoin</h2>
    <div class="likecoin-container">
        <iframe class="LikeCoin"
            src="https://button.like.co/in/embed/{{ $LikerID }}/button?referrer={{ .Permalink }}"
            width="100%"
            height="450"
            frameborder="0">
        </iframe>
    </div>
</section>
